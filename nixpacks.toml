[phases.setup]
nixPkgs = ["python311", "python311Packages.pip", "nodejs_20", "ffmpeg"]

[phases.build]
cmds = ["cd frontend && npm install && npm run build && cd ../backend && pip install -r requirements.txt --break-system-packages"]

[start]
cmd = "gunicorn --chdir backend app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4"